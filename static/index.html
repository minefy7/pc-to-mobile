<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12151c">
  <title>Чат</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="reconnect-banner" class="banner hidden">Переподключение…</div>

  <header class="topbar">
    <div class="brand">Чат</div>
    <div class="meta">
      <span id="typing" class="typing"></span>
      <span id="presence" class="presence" title="Сейчас онлайн">—</span>
    </div>
    <input id="name-input" class="name-input" maxlength="40" placeholder="Ваше имя" autocomplete="nickname">
  </header>

  <main id="messages" class="messages"></main>
  <button id="load-more" class="load-more hidden">Загрузить ещё</button>

  <footer class="composer">
    <input id="text-input" class="text-input" type="text" maxlength="4000"
           placeholder="Сообщение…" autocomplete="off" enterkeyhint="send">
    <button id="send" class="btn send" title="Отправить">➤</button>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
